name: Android-APK bauen

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Speicherplatz freimachen
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Godot und Export-Vorlagen (Cache)
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Godot herunterladen
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cd ~/godot
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip && rm Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz && rm Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          ls ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/ | head

      - name: Importierte Dateien (Cache)
        uses: actions/cache@v4
        with:
          path: .godot
          key: import-${{ hashFiles('**/*.import') }}
          restore-keys: import-

      - name: Debug-Schlüssel und Editor-Einstellungen
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore ~/debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres editor_settings-4.7.tres; do
          cat > ~/.config/godot/$f <<EOT
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
          sed -i 's/^ *//' ~/.config/godot/$f
          done
          cat ~/.config/godot/editor_settings-4.7.tres
          # nur die fürs Handy nötige Texturkompression (schnellerer Import)
          sed -i 's/^textures\/vram_compression\/import_s3tc_bptc=.*//' project.godot
          sed -i '/^\[rendering\]/a textures/vram_compression/import_s3tc_bptc=false' project.godot

      - name: Assets importieren
        run: |
          GODOT=~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          mkdir -p build
          (timeout 7000 $GODOT --headless --path . --import || true) > build/import.log 2>&1
          (timeout 3000 $GODOT --headless --path . --import || true) >> build/import.log 2>&1
          tail -5 build/import.log

      - name: Welt vorab bauen (kurze Ladezeit im Spiel)
        run: |
          sudo apt-get install -y xvfb > /dev/null 2>&1 || true
          GODOT=~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          mkdir -p build
          timeout 3600 xvfb-run -a -s "-screen 0 640x480x24" $GODOT --rendering-method gl_compatibility --rendering-driver opengl3 --path . -s tools/welt_bake.gd > build/bake.log 2>&1 || true
          grep -E "ERZEUGT|GESPEICHERT|SCRIPT ERROR" build/bake.log | head -20
          ls -la assets/cache/welt/
          test -f assets/cache/welt/welt.scn

      - name: APK exportieren
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          GODOT=~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          $GODOT --headless --path . --export-debug "Android" build/radeberg.apk > build/export.log 2>&1 || true
          tail -60 build/export.log
          ls -la build/
          # Ausdrücklich ausrichten und signieren (Godots eigenes Signieren klappt bei sehr großen APKs nicht zuverlässig)
          BT=$(ls -d $ANDROID_SDK_ROOT/build-tools/* | sort -V | tail -1)
          echo "Build-Tools: $BT"
          $BT/zipalign -p -f 4 build/radeberg.apk build/aligned.apk
          $BT/apksigner sign --ks ~/debug.keystore --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out build/signed.apk build/aligned.apk
          $BT/apksigner verify --verbose build/signed.apk | head -8
          mv build/signed.apk build/radeberg.apk && rm -f build/aligned.apk
          ls -la build/
          {
            echo "Automatisch gebaute Testversion. APK aufs Handy laden und installieren (Installation aus unbekannten Quellen erlauben)."
            echo ""
            echo "APK-Größe: $(du -h build/radeberg.apk | cut -f1)"
            echo ""
            echo "Signatur: $($(ls -d $ANDROID_SDK_ROOT/build-tools/* | sort -V | tail -1)/apksigner verify build/radeberg.apk >/dev/null 2>&1 && echo OK || echo FEHLT)"
            echo '```'
            grep -E "ERROR|SCRIPT ERROR|WARNING" build/import.log build/export.log | sed 's/\x1b\[[0-9;]*m//g' | sort | uniq -c | sort -rn | head -40
            echo '```'
          } > build/notes.md
          test -f build/radeberg.apk

      - name: APK als Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: radeberg-apk
          path: build/radeberg.apk
          retention-days: 30

      - name: Release mit APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Radeberg Testversion ${{ github.run_number }}
          body_path: build/notes.md
          files: build/radeberg.apk
          prerelease: true
